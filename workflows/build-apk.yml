# GitHub only runs workflows from ".github/workflows/" at the repository root.
# (A visible copy of this exact file is kept in "workflows/" for phones / file managers that hide dot-folders.)
name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the APK to a GitHub Release when you push a v* tag

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK / NDK components
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1" \
            || echo "sdkmanager step failed; continuing with the preinstalled SDK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Collect APK (flat, no wrapper folder)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ExplodeArena.apk
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExplodeArena-apk
          path: dist/ExplodeArena.apk
          if-no-files-found: error

      - name: Attach APK to release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ExplodeArena.apk
